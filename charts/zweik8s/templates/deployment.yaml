{{- $runtime := include "zweik8s.runtime" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zweik8s.fullname" . }}
  labels:
    {{- include "zweik8s.labels" . | nindent 4 }}
spec:
  # One gateway per cluster: the peer's WireGuard session pins to a single endpoint.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "zweik8s.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zweik8s.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        zweik8s.io/config: {{ $runtime | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "zweik8s.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ add (.Values.tuning.drainSeconds | default 10) 5 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
          {{- with .Values.preferredNodes }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      {{- toYaml . | nindent 22 }}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "zweik8s.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [run, --config, /config/runtime.json]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: wireguard
              containerPort: {{ .Values.tunnel.listenPort }}
              protocol: UDP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          securityContext:
            # Creating the WireGuard interface and the pod-local firewall needs NET_ADMIN.
            runAsUser: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            exec:
              command: [zweik8s, probe, /readyz, --addr, "127.0.0.1:{{ .Values.metrics.port }}"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [zweik8s, probe, /livez, --addr, "127.0.0.1:{{ .Values.metrics.port }}"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: {{ include "zweik8s.secretName" . }}
            defaultMode: 0400
        - name: config
          configMap:
            name: {{ include "zweik8s.fullname" . }}
