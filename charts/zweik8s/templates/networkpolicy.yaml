{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zweik8s.fullname" . }}
  labels:
    {{- include "zweik8s.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zweik8s.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Encrypted traffic from the peer; WireGuard authenticates every packet.
    - ports:
        - port: {{ .Values.tunnel.listenPort }}
          protocol: UDP
    {{- range $i := .Values.imports }}
    - from:
        {{- range $c := $i.callers }}
        - namespaceSelector:
            {{- if eq $c.namespace "*" }} {}
            {{- else }}
            matchLabels:
              kubernetes.io/metadata.name: {{ $c.namespace }}
            {{- end }}
          podSelector:
            matchLabels:
              {{- toYaml $c.matchLabels | nindent 14 }}
        {{- end }}
      ports:
        {{- range $p := $i.ports }}
        - port: {{ $p.tunnelPort }}
          protocol: {{ $p.protocol | default "TCP" | upper }}
        {{- end }}
    {{- end }}
    {{- if and .Values.metrics.enabled .Values.metrics.allowFrom }}
    - from:
        {{- toYaml .Values.metrics.allowFrom | nindent 8 }}
      ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
    {{- end }}
{{- end }}
