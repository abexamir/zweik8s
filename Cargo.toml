[package]
name = "zweik8s"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Connect services between two Kubernetes clusters over one WireGuard tunnel"
license = "Apache-2.0"
repository = "https://github.com/abexamir/zweik8s"
readme = "README.md"
keywords = ["kubernetes", "wireguard", "tunnel", "multi-cluster"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros", "process"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
