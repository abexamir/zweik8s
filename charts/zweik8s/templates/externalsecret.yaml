{{- $es := .Values.keys.externalSecret }}
{{- if and $es.enabled (not .Values.keys.existingSecret) }}
{{- if not (and $es.secretStoreRef.name $es.remoteKey) }}{{ fail "keys.externalSecret needs secretStoreRef.name and remoteKey" }}{{ end }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "zweik8s.fullname" . }}
  labels:
    {{- include "zweik8s.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "zweik8s.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: private-key
      remoteRef:
        key: {{ $es.remoteKey }}
        property: {{ $es.privateKeyProperty }}
    - secretKey: peer-public-key
      remoteRef:
        key: {{ $es.remoteKey }}
        property: {{ $es.peerPublicKeyProperty }}
{{- end }}
